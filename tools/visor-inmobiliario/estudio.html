<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>cre8eight Estudio</title>
  <meta name="description" content="Crea recorridos virtuales 360 para inmuebles sin tocar código: fotos, plano, datos y publicación.">
  <script src="tema.js"></script>
  <script src="sonidos.js"></script>
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="estudio.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body class="c8-base seccion-fotos">
  <header id="barra-sup" class="c8-vidrio c8-vidrio--barra">
    <div class="marca-estudio">
      <span class="logo-e" aria-hidden="true">c8</span>
      <span class="nombre-app">cre<b>8</b>eight <small>Estudio</small></span>
    </div>
    <button id="btn-proyecto" class="nombre-proyecto" type="button" aria-haspopup="menu" aria-expanded="false" title="Proyecto: mis proyectos, nuevo, copia de seguridad (Ctrl+O: mis proyectos)">
      <span class="pre">Proyecto:</span> <span id="nombre-proyecto">Proyecto sin título</span>
    </button>
    <span id="estado-guardado" class="estado-guardado" role="status" aria-live="polite"></span>
    <div class="relleno"></div>
    <div class="grupo-botones">
      <button id="btn-deshacer" class="c8-boton c8-boton--fantasma c8-boton--icono" type="button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
      <button id="btn-rehacer" class="c8-boton c8-boton--fantasma c8-boton--icono" type="button" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer"></button>
    </div>
    <button id="btn-vista" class="c8-boton c8-boton--fantasma" type="button" aria-pressed="false" aria-controls="vista" title="Mostrar u ocultar la vista previa"><span class="texto">Vista previa</span></button>
    <a id="btn-guia" class="c8-boton c8-boton--fantasma" href="asistente-osmo.html" target="_blank" rel="noopener" title="Guía Osmo 360: cómo hacer las fotos con la DJI Osmo 360"><span class="largo">Guía Osmo 360</span><span class="corto">Guía</span></a>
    <button id="btn-apariencia" class="c8-boton c8-boton--fantasma c8-boton--icono" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Apariencia y tamaño" title="Apariencia (automático, claro u oscuro), tamaño y transparencia"></button>
    <button id="btn-ayuda" class="c8-boton c8-boton--fantasma c8-boton--icono" type="button" title="Ayuda y atajos (?)" aria-label="Ayuda y atajos"></button>
    <button id="btn-perfil" class="c8-boton c8-boton--secundario" type="button" aria-label="Mi inmobiliaria"><span class="texto">Mi inmobiliaria</span></button>
    <button id="btn-publicar" class="c8-boton c8-boton--secundario" type="button" title="Publicar (Ctrl+E)"><span class="texto">Publicar</span></button>
  </header>

  <nav id="pasos" class="c8-vidrio c8-vidrio--texto" aria-label="Pasos del recorrido"></nav>

  <main id="trabajo" tabindex="-1"></main>

  <aside id="vista" class="c8-vidrio c8-vidrio--texto sin-fotos" aria-label="Vista previa del recorrido">
    <div class="vista-cab">
      <span class="vista-titulo">Vista previa</span>
      <div id="vista-dispositivo" class="c8-segmentado" role="radiogroup" aria-label="Ver la vista previa como en">
        <label title="Como la verá un cliente en el móvil"><input type="radio" name="vista-dispositivo" value="movil"><span>Móvil</span></label>
        <label title="Como la verá un cliente en el ordenador"><input type="radio" name="vista-dispositivo" value="ordenador" checked><span>Ordenador</span></label>
      </div>
      <select id="vista-nodo" aria-label="Estancia en la vista previa"></select>
      <button id="vista-plegar" class="c8-boton c8-boton--fantasma c8-boton--icono c8-boton--s" type="button" title="Ampliar o reducir la vista previa" aria-label="Ampliar vista previa"></button>
    </div>
    <div class="vista-marco">
      <iframe id="iframe-visor" src="index.html?embed&estudio" title="Vista previa del visor" allow="fullscreen; gyroscope; accelerometer"></iframe>
      <div id="vista-vacia" class="vista-vacia">
        <p>Añade fotos 360 para ver aquí el recorrido tal y como lo verán tus clientes.</p>
      </div>
      <div id="vista-error" class="vista-vacia" role="alert" hidden>
        <div>
          <p>La vista previa no responde.</p>
          <button id="vista-reintentar" class="c8-boton c8-boton--secundario c8-boton--s" type="button">Recargar la vista previa</button>
        </div>
      </div>
      <div id="vista-modo" class="vista-modo" hidden></div>
    </div>
    <div id="vista-pie" class="vista-pie"></div>
  </aside>

  <div id="arrastre" class="arrastre" hidden>
    <div><strong>Suelta aquí</strong><span>Fotos 360 (JPG), una copia de seguridad (ZIP) o una carpeta con tour.json</span></div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="estudio.js"></script>
</body>
</html>
