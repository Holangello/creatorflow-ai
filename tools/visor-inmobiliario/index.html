<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <title>Recorrido Virtual 3D</title>
  <meta name="description" content="Recorrido virtual 360, paseo libre en 3D y maqueta interactiva del inmueble.">
  <link rel="stylesheet" href="visor.css">
  <link rel="stylesheet" href="paneles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="lienzo" tabindex="0" role="application" aria-roledescription="visor 3D" aria-label="Recorrido virtual"></canvas>
    <div id="etiquetas"></div>

    <header id="barra">
      <img id="logo" alt="" hidden>
      <div class="titulos">
        <h1 id="titulo">Recorrido virtual</h1>
        <p id="estancia" aria-live="polite"></p>
      </div>
    </header>
    <nav id="modos" role="tablist" aria-label="Modo de visita">
      <button type="button" role="tab" data-modo="tour" aria-selected="true">Recorrido 360</button>
      <button type="button" role="tab" data-modo="libre" aria-selected="false">Modo libre 3D</button>
      <button type="button" role="tab" data-modo="maqueta" aria-selected="false">Maqueta 3D</button>
    </nav>

    <div id="iconos">
      <button id="btn-giro" type="button" class="icono" aria-label="Giroscopio" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M3 9a10 10 0 0 0 0 6M21 9a10 10 0 0 1 0 6"/></svg>
      </button>
      <button id="btn-ayuda" type="button" class="icono" aria-label="Controles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.6"/><circle cx="12" cy="17" r=".6"/></svg>
      </button>
      <button id="btn-pantalla" type="button" class="icono" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <aside id="minimapa" aria-label="Plano">
      <div id="plantas" role="group" aria-label="Plantas" hidden></div>
      <canvas id="mapa" aria-hidden="true"></canvas>
      <button id="btn-mapa" type="button" class="mini" aria-label="Ampliar plano" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
      </button>
    </aside>

    <nav id="galeria" aria-label="Estancias"></nav>

    <div id="subtitulo" aria-live="polite" hidden></div>
    <div id="cortinilla" hidden>
      <button type="button" role="slider" aria-label="Comparar antes y después" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg>
      </button>
    </div>
    <div id="joystick" aria-hidden="true"><div id="joystick-pomo"></div></div>
    <div id="pista" role="status" hidden></div>

    <div id="ficha" role="dialog" aria-modal="false" aria-labelledby="ficha-titulo" hidden>
      <button type="button" class="cerrar" aria-label="Cerrar">×</button>
      <h2 id="ficha-titulo"></h2>
      <p></p>
      <div class="media"></div>
    </div>

    <div id="ayuda" role="dialog" aria-modal="false" aria-labelledby="ayuda-titulo" hidden>
      <button type="button" class="cerrar" aria-label="Cerrar">×</button>
      <h2 id="ayuda-titulo">Controles</h2>
      <div class="cols"></div>
    </div>

    <div id="carga" hidden><div class="barra"><div></div></div></div>
    <div id="aviso" role="status" hidden></div>
    <div id="paneles"></div>
    <noscript><p class="sin-js">Este recorrido necesita JavaScript.</p></noscript>
  </div>
  <script type="module" src="visor.js"></script>
</body>
</html>
